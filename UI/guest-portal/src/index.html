<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Tartware Guest Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e1a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Self-service guest portal — book rooms, check in, and manage your stay">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
  <script>
    // Guests have no account at booking time, so there is no stored preference
    // to honour — the OS setting is the only signal, and it is followed live.
    // Runs before first paint so the page never flashes the wrong theme.
    (function () {
      var q = window.matchMedia('(prefers-color-scheme: dark)');
      var apply = function (dark) {
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      };
      apply(q.matches);
      q.addEventListener('change', function (e) { apply(e.matches); });
    })();
  </script>
</head>
<body>
  <gp-root></gp-root>
</body>
</html>
