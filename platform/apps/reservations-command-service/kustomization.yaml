apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Was `pms`, a namespace no manifest in this repo ever creates. Everything
# else — base-config.yaml, the Helm values, the NetworkPolicies and the
# Istio AuthorizationPolicies — targets tartware-system, so a workload in
# `pms` would sit outside sidecar injection and outside every policy that
# is supposed to govern it.
namespace: tartware-system
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
