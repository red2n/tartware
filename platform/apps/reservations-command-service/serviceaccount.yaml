# Workload identity for reservations-command-service.
#
# This ServiceAccount name is load-bearing: it produces the SPIFFE id
#   spiffe://cluster.local/ns/tartware-system/sa/reservations-command-service
# which platform/kubernetes/istio/authorization-policies.yaml names as the
# only principal allowed to call availability-guard-service's gRPC port.
# Renaming it silently breaks that call.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reservations-command-service
  labels:
    app: reservations-command-service
    app.kubernetes.io/part-of: tartware
