apiVersion: v1
kind: Service
metadata:
  name: reservations-command-service
  labels:
    app: reservations-command-service
spec:
  selector:
    app: reservations-command-service
  ports:
    - name: http
      port: 80
      targetPort: http
    # Sidecar merged-metrics port, targeted by servicemonitor.yaml.
    - name: istio-metrics
      port: 15020
      targetPort: 15020
  type: ClusterIP
