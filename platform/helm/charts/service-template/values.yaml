replicaCount: 3

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Each service MUST have its own ServiceAccount. The ServiceAccount is the
# workload's identity in the mesh: Istio mints a certificate for
# spiffe://cluster.local/ns/<ns>/sa/<name> and every authorization decision
# is made against it. Sharing one ServiceAccount across services would make
# them indistinguishable to the policy engine.
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Service mesh / zero-trust settings.
istio:
  # Inject the Envoy sidecar. Turning this off removes the workload from the
  # mesh, which means it can neither present nor verify an identity — with
  # STRICT PeerAuthentication in place it simply stops being reachable.
  injection: true

  # Network tier. `domain-service` is selected by the namespace policy that
  # restricts inbound traffic to the api-gateway identity. Only api-gateway
  # itself should ever override this.
  tier: domain-service

  # Render a per-service AuthorizationPolicy pinning the set of SPIFFE
  # principals allowed to call it. Empty list means "inherit the namespace
  # rule" (api-gateway only).
  authorizedCallers: []

  # Ports this service exposes to sanctioned east-west callers in addition
  # to its HTTP port — e.g. availability-guard-service's gRPC port.
  extraAuthorizedPorts: []

# L3/L4 backstop enforced by the CNI, independent of the Envoy sidecar.
networkPolicy:
  enabled: true
  # Pod `app` labels mirroring istio.authorizedCallers. Kept separate
  # because NetworkPolicy selects on labels while Istio selects on SPIFFE
  # identities — the two are not interchangeable.
  additionalIngressPods: []
  # Namespaces this service may open connections to. Trimmed per service
  # where possible; a stateless service needs far less than this.
  egressNamespaces:
    - database
    - cache
    - messaging
    - observability

# These annotations are what tell the Istio sidecar which application port
# and path to scrape when building its merged /stats/prometheus output. They
# are not read by Prometheus directly — Prometheus targets port 15020 via the
# ServiceMonitor/PodMonitor.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

# `templates/servicemonitor.yaml` reads .Values.monitoring.serviceMonitor.enabled.
# The key was previously absent, so rendering the chart failed with a nil
# pointer error on that template.
monitoring:
  serviceMonitor:
    enabled: true

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# External exposure is denied by construction.
#
# The platform has exactly one ingress path: internet →
# istio-ingressgateway → api-gateway (platform/kubernetes/istio/gateway.yaml).
# A Kubernetes Ingress pointed at a backend Service would route around the
# gateway's authentication, rate limiting and tenant scoping, so the
# template refuses to render one unless `allowExternalExposure` is set
# explicitly — a deliberate, reviewable act rather than a typo.
ingress:
  enabled: false
  # Guard rail. Must be true for `enabled: true` to be honoured.
  allowExternalExposure: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 30
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

nodeSelector: {}

tolerations: []

affinity:
  {}

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: LOG_LEVEL
    value: "info"

  # Application-level check that the caller's mTLS identity is one we accept,
  # independent of the Envoy sidecar enforcing the same thing.
  #
  # Ships as "warn" on purpose. Switching straight to "enforce" rejects every
  # caller whose ServiceAccount is not yet in the list below, including ones
  # nobody remembered. Run in warn, confirm the logs are clean
  # ("unverified mesh caller" should stop appearing), then set "enforce".
  - name: MESH_IDENTITY_ENFORCEMENT
    value: "warn"
  # Both spellings of the gateway ServiceAccount — the raw manifests in
  # platform/kubernetes/ and the Helm release name it differently.
  - name: MESH_ALLOWED_PRINCIPALS
    value: "cluster.local/ns/tartware-system/sa/api-gateway,cluster.local/ns/tartware-system/sa/tartware-api-gateway"

  # Database
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: database-config
        key: host
  - name: DB_PORT
    valueFrom:
      configMapKeyRef:
        name: database-config
        key: port
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: database-config
        key: database
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: database-credentials
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: database-credentials
        key: password

  # Redis
  - name: REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: redis-config
        key: host
  - name: REDIS_PORT
    valueFrom:
      configMapKeyRef:
        name: redis-config
        key: port
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-credentials
        key: password

  # Kafka
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        name: messaging-config
        key: kafka-brokers
  - name: KAFKA_FAILOVER_BROKERS
    valueFrom:
      configMapKeyRef:
        name: messaging-config
        key: kafka-failover-brokers
  - name: KAFKA_ACTIVE_CLUSTER
    value: primary
  - name: KAFKA_FAILOVER_ENABLED
    value: "false"

  # NATS
  - name: NATS_URL
    valueFrom:
      configMapKeyRef:
        name: messaging-config
        key: nats-url

  # OpenTelemetry
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  - name: OTEL_SERVICE_NAME
    value: "{{ include \"service.fullname\" . }}"

extraEnv: []

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /app/.cache

volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1
