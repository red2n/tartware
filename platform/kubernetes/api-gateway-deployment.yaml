---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: tartware-system
data:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  # Database config - use Kubernetes service DNS
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5433"
  DATABASE_NAME: "tartware"
  DATABASE_USER: "postgres"
  # Redis config - use Kubernetes service DNS
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # Kafka config - use Kubernetes service DNS
  KAFKA_BROKERS: "kafka-service:9092"
  JWT_EXPIRES_IN: "24h"
  # Service URLs - internal K8s services
  CORE_SERVICE_URL: "http://core-service:3000"
  BILLING_SERVICE_URL: "http://billing-service:3100"
  GUESTS_SERVICE_URL: "http://guests-service:3300"
  HOUSEKEEPING_SERVICE_URL: "http://housekeeping-service:3200"
  RESERVATIONS_SERVICE_URL: "http://reservations-command-service:3101"
  ROOMS_SERVICE_URL: "http://rooms-service:3400"
  SETTINGS_SERVICE_URL: "http://settings-service:3500"

---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: tartware-system
type: Opaque
# WARNING: Replace these placeholder values with secure secrets before deploying.
# In production, use external-secrets-operator, HashiCorp Vault, or inject from CI/CD.
stringData:
  JWT_SECRET: "__REPLACE_WITH_SECURE_JWT_SECRET__"
  DATABASE_PASSWORD: "__REPLACE_WITH_SECURE_PASSWORD__"
  REDIS_PASSWORD: "__REPLACE_WITH_SECURE_PASSWORD__"

---
# Dedicated ServiceAccount — this is the gateway's identity in the mesh.
#
# Istio issues a certificate for
#   spiffe://cluster.local/ns/tartware-system/sa/api-gateway
# and every domain service authorizes inbound calls against exactly that
# principal. Running on the `default` ServiceAccount (the previous
# behaviour) would give the gateway the same identity as any other pod
# that also defaulted, making the authorization rule meaningless.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: tartware-system
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: tartware

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tartware-system
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: tartware
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: tartware
        # Deliberately NOT `tier: domain-service`. That label selects the
        # policy restricting inbound traffic to the api-gateway identity;
        # applying it here would tell the gateway to accept calls only
        # from itself.
        tier: gateway
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      serviceAccountName: api-gateway
      # Uncomment and create the PriorityClass resource separately if needed:
      # priorityClassName: tartware-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: tartware/api-gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tartware-system
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http

---
# INGRESS — intentionally removed.
#
# North-south traffic now enters through the Istio ingress gateway, which
# is defined in platform/kubernetes/istio/gateway.yaml along with its
# TLS certificate and the single VirtualService route to this Service.
#
# Two reasons the nginx Ingress had to go:
#
#  1. An nginx Ingress forwards to the Service over plain HTTP from a pod
#     with no mesh identity. Under STRICT PeerAuthentication that
#     connection is rejected, and if it were permitted it would be the one
#     unauthenticated hop in the whole request path.
#
#  2. Its `nginx.ingress.kubernetes.io/rewrite-target: /` annotation
#     rewrote every request path to `/` before proxying, so nothing but
#     the root route was reachable through it.
#
# Do not add an Ingress for any Tartware Service.

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: tartware-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
