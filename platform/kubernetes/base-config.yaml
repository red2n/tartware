# High-Performance Configuration for 30k ops/sec

# This configuration provides:
# - Aggressive autoscaling with rapid scale-up
# - Resource quotas to prevent resource starvation
# - Network policies for security
# - Pod priority classes for critical services

---
# Priority Classes
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tartware-critical
value: 1000000
globalDefault: false
description: "Critical services that must run (API Gateway, Core Service)"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tartware-high
value: 100000
globalDefault: false
description: "High priority services (Reservations, Billing)"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tartware-normal
value: 10000
globalDefault: true
description: "Normal priority services"

---
# Namespace for application
apiVersion: v1
kind: Namespace
metadata:
  name: tartware-system
  labels:
    # Sidecar injection. Every workload here must be in the mesh — a pod
    # without a sidecar holds no identity and, under STRICT mTLS, can
    # neither call nor be called by anything else in the namespace.
    istio-injection: enabled
    monitoring: enabled
    # Duplicates the automatic `kubernetes.io/metadata.name` label so that
    # policies written against either convention select correctly.
    name: tartware-system

---
# Resource Quotas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tartware-quota
  namespace: tartware-system
spec:
  hard:
    requests.cpu: "200"
    requests.memory: "400Gi"
    limits.cpu: "400"
    limits.memory: "800Gi"
    persistentvolumeclaims: "50"
    services.loadbalancers: "5"

---
# Limit Ranges
apiVersion: v1
kind: LimitRange
metadata:
  name: tartware-limits
  namespace: tartware-system
spec:
  limits:
    - max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "200m"
        memory: "256Mi"
      type: Container
    - max:
        cpu: "16"
        memory: "32Gi"
      min:
        cpu: "500m"
        memory: "512Mi"
      type: Pod

---
# NETWORK POLICY — intentionally not defined here.
#
# This file used to carry a `tartware-allow-internal` policy whose egress
# section was `to: [namespaceSelector: {}]` — i.e. every pod may reach every
# namespace in the cluster. NetworkPolicy rules are additive (a connection is
# permitted if ANY policy allows it), so that single rule overrode every
# restriction in network-policies.yaml and left egress wide open.
#
# Its ingress section was broken in the opposite direction: it selected
# namespaces by a `name:` label that none of these namespaces actually carry
# (Kubernetes sets `kubernetes.io/metadata.name`, not `name`), so it matched
# nothing and contributed no access at all.
#
# All network policy for this namespace now lives in one place:
#   platform/kubernetes/network-policies.yaml
# Do not reintroduce a broad allow rule here — it cannot be scoped down by a
# stricter policy elsewhere.

---
# ConfigMap for Database Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: tartware-system
data:
  host: "postgres-postgresql.database.svc.cluster.local"
  port: "5433"
  database: "tartware"
  # Connection pool settings for high throughput
  pool-min: "10"
  pool-max: "50"
  connection-timeout: "5000"
  idle-timeout: "30000"

---
# ConfigMap for Redis Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: tartware-system
data:
  host: "redis-master.cache.svc.cluster.local"
  port: "6379"
  # Redis performance settings
  max-connections: "1000"
  connection-timeout: "5000"

---
# ConfigMap for Messaging Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: messaging-config
  namespace: tartware-system
data:
  kafka-brokers: "redpanda-0.redpanda.messaging.svc.cluster.local:9092,redpanda-1.redpanda.messaging.svc.cluster.local:9092,redpanda-2.redpanda.messaging.svc.cluster.local:9092,redpanda-3.redpanda.messaging.svc.cluster.local:9092,redpanda-4.redpanda.messaging.svc.cluster.local:9092,redpanda-5.redpanda.messaging.svc.cluster.local:9092,redpanda-6.redpanda.messaging.svc.cluster.local:9092"
  kafka-failover-brokers: "redpanda-failover.messaging.svc.cluster.local:9092"
  kafka-critical-topics: "commands.primary,reservations.events,rooms.inventory.*"
  nats-url: "nats://nats-jetstream.messaging.svc.cluster.local:4222"
  # Performance settings
  kafka-batch-size: "65536"
  kafka-linger-ms: "20"
  kafka-compression: "zstd"
  command-topic-partitions: "128"
  command-dlq-partitions: "64"

---
# Vertical Pod Autoscaler for critical services
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api-gateway-vpa
  namespace: tartware-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 500m
          memory: 512Mi
        maxAllowed:
          cpu: 4000m
          memory: 8Gi

---
# Pod Monitor for custom metrics
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tartware-services
  namespace: tartware-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: tartware
  podMetricsEndpoints:
    # Scrape the sidecar's merged-metrics endpoint, NOT the application
    # port. Under STRICT mTLS the app port only accepts connections that
    # present a mesh certificate, and Prometheus (in the un-injected
    # `observability` namespace) has none — scraping `port: http` would
    # fail every time with a TLS handshake error.
    #
    # pilot-agent serves this port outside the mTLS and authorization
    # path, and merges the application's own /metrics into the output, so
    # no application metrics are lost.
    - targetPort: 15020
      path: /stats/prometheus
      interval: 15s
