name: Guardrails

# The repo's cross-cutting checks, on every branch.
#
# Every other workflow triggers on `[main, develop, deployment]` (or a filtered
# pull_request), so a feature branch with no PR open runs nothing. That is how a
# statement naming a column the table does not have — every PUT and DELETE on a
# booking source returning 500 — survived six days of daily commits: the check
# that catches it exists, is wired into build.yml, and was never reached.
#
# So this workflow deliberately has no branch filter. It is kept to the checks
# that need neither a database nor a running stack, and the whole job is a few
# seconds of work after the caches are warm; the heavy matrix build stays in
# build.yml on main/develop.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A branch only needs the guardrails for its newest commit.
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `nx run-many -t biome` runs the projects that HAVE a biome target and
      # says nothing about the rest, so a project added without one is invisible:
      # `pnpm run check` goes green while that code is never inspected. UI/pms-ui
      # and UI/guest-portal sat unchecked that way. Asserts coverage instead of
      # inferring it from a green run. Needs no build, so it runs first.
      - name: Guardrail coverage
        run: pnpm run check:guardrails

      # Shared entry points are only worth having if every service goes through
      # them. `createKafkaClient()` existed while five services still called
      # `new Kafka(...)` directly, which is how raw KafkaJS JSON ended up
      # interleaved with the pino output. Asserts the convention instead of
      # trusting it. Needs no build either.
      - name: Shared framework usage
        run: pnpm run check:frameworks

      # eslint's type-aware rules resolve a workspace import through the target
      # package's dist, so any library whose types cross a package boundary has
      # to be built before Lint runs. That used to be true by accident — no
      # service consumed a workspace type — until service code started holding
      # the return type of createKafkaClient. Without this, lint reports a wall
      # of no-unsafe-* errors in files that are perfectly fine.
      #
      # UI projects are excluded: nothing lints against their output.
      - name: Build workspace libraries
        run: npx nx run-many -t build --exclude=@tartware/pms-ui,@tartware/guest-portal

      # Lint, formatting and dead-code checks for every project that has them.
      # These lived only in the per-package workflows, which fire on
      # [main, develop, deployment] or a filtered pull_request — so on a feature
      # branch with no PR they ran on nothing, which is the same gap this
      # workflow exists to close.
      - name: Lint
        run: pnpm run lint

      - name: Biome
        run: pnpm run biome

      - name: Knip
        run: pnpm run knip

      # Binds every SQL string in Apps/ to the DDL in scripts/tables/. Self-tests
      # before it reports: a scanner that has stopped meaning something exits 2
      # rather than printing a verdict.
      - name: SQL contracts
        run: pnpm run sql:contracts

      # Gateway ↔ downstream routing, command catalog ↔ flow registry ↔ payload
      # validators ↔ consumers, and outbox enqueue ↔ dispatcher: each of those
      # links has been broken at least once, and each break is silent — a
      # command accepted and dropped, a 200 with nothing behind it.
      #
      # This used to run two cherry-picked suites. Every project now has a test
      # target (asserted by the guardrail coverage step above), so run the lot:
      # the unit suites are fast and need no database.
      - name: Tests
        run: pnpm run test
